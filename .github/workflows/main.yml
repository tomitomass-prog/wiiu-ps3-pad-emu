name: Build experimental DS3 USB (ESP32-S2)
on:
  push:
    branches: [main, master]
    paths:
      - 'usb-s2-ps3/**'
      - 'shared/**'
      - '.github/workflows/ps3.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ps3-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install 'platformio==6.1.19'
      - name: Build PS3-like USB prototype
        run: python -m platformio run -d usb-s2-ps3 -e lolin_s2_ps3
      - name: Export firmware
        uses: actions/upload-artifact@v5
        with:
          name: lolin-s2-ps3-experimental
          path: |
            usb-s2-ps3/.pio/build/lolin_s2_ps3/firmware.bin
            usb-s2-ps3/.pio/build/lolin_s2_ps3/bootloader.bin
            usb-s2-ps3/.pio/build/lolin_s2_ps3/partitions.bin
          if-no-files-found: error
